# --- Sensor bus + Zephyr sensor API ---
CONFIG_I2C=y
CONFIG_SENSOR=y
# LIS2DUXS12 accelerometer on the X-NUCLEO-IKS4A1 (driver is called LIS2DUX12)
CONFIG_LIS2DUX12=y

# --- Console output ---
# printf() with floats (needed to print "x,y,z" as decimals)
CONFIG_REQUIRES_FLOAT_PRINTF=y
# Keep the serial line CLEAN: the Edge Impulse data forwarder expects ONLY
# "number,number,number" lines. Turn off logging so nothing else is printed.
CONFIG_LOG=n

CONFIG_MAIN_STACK_SIZE=2048
