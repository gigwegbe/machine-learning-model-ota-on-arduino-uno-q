CONFIG_GPIO=y
# enable c++ support
CONFIG_CPP=y
CONFIG_GLIBCXX_LIBCPP=y
CONFIG_NEWLIB_LIBC=y
CONFIG_REQUIRES_FLOAT_PRINTF=y
CONFIG_FPU=y

CONFIG_MAIN_STACK_SIZE=8192
CONFIG_CONSOLE_SUBSYS=y
CONFIG_CONSOLE_GETLINE=y

# Logging
CONFIG_LOG=y
CONFIG_ASSERT=y
CONFIG_LOG_PROCESS_THREAD_STACK_SIZE=1024

CONFIG_HEAP_MEM_POOL_SIZE=16384

# Edge Impulse SDK
CONFIG_EDGE_IMPULSE_SDK=y
# 0: malloc/free, 1: k_malloc/k_free
CONFIG_EDGE_IMPULSE_HEAP_TYPE=1
################################################################################
# Debug configuration (logger using RTT)

# CONFIG_LOG2_MODE_DEFERRED=y
# CONFIG_USE_SEGGER_RTT=y
# CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=4096
# CONFIG_LOG_BACKEND_RTT=y
# CONFIG_LOG_PRINTK=y

# Audio/PDM support
#CONFIG_I2S=y
#CONFIG_AUDIO=y
#CONFIG_AUDIO_DMIC=y

# Sensors on X-Nucleo IKS02A1
CONFIG_I2C=y
CONFIG_SENSOR=y

# Sensors on X-Nucleo IKS4A1 (drivers default to =y when the shield DT nodes are enabled;
# listed explicitly for clarity)
CONFIG_LSM6DSV16X=y
CONFIG_LIS2DUX12=y
